name: Deploy to EC2

# main 푸시 시 자동 배포 (수동 실행도 가능)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build bootJar (테스트 제외 — contextLoads가 DB 필요)
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      - name: Copy jar to EC2 (staging dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/lucky-deploy"
          strip_components: 2   # build/libs/ 경로 제거하고 jar 파일만 전송

      - name: Deploy & restart on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo mkdir -p /opt/lucky
            sudo mv /home/ubuntu/lucky-deploy/*.jar /opt/lucky/app.jar
            sudo systemctl restart lucky
            sleep 3
            sudo systemctl --no-pager status lucky | head -n 20
