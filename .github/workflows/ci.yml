name: CI

# main 푸시 + 모든 PR에서 빌드 검증
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 테스트는 일단 제외: 기본 contextLoads 테스트가 DB 연결을 필요로 함.
      # 나중에 Testcontainers(임시 Postgres) 붙이면 -x test 빼고 전체 테스트 가능.
      - name: Build
        run: ./gradlew build -x test
